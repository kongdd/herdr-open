name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: command -v jq || brew install jq
      - run: bash -n herdr-open && bash -n herdr-open-relay
      - run: bash tests/test.sh
