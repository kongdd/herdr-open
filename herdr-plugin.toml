id = "kongdd.open"
name = "Open in Editor"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Open the focused workspace in local Zed or VS Code, including SSH workspaces"
platforms = ["linux", "macos"]

[[actions]]
id = "open-zed"
title = "Open in Zed"
contexts = ["workspace"]
command = ["bash", "./herdr-open", "open", "zed"]

[[actions]]
id = "open-code"
title = "Open in VS Code"
contexts = ["workspace"]
command = ["bash", "./herdr-open", "open", "code"]
