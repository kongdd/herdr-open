id = "kongdd.open"
name = "Open in Editor"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Open the focused workspace in local Zed or VS Code, including SSH workspaces"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open-zed"
title = "Open in Zed"
contexts = ["workspace"]
command = ["./target/release/herdr-open", "open", "zed"]

[[actions]]
id = "open-code"
title = "Open in VS Code"
contexts = ["workspace"]
command = ["./target/release/herdr-open", "open", "code"]
